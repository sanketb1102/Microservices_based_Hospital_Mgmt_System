events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  server {
    listen 80;

    # ---- Static frontend ------------------------------------------------
    # Plain HTML, CSS and JavaScript. No build step and no framework
    # runtime -- Nginx serves the files exactly as they are written.
    root /usr/share/nginx/html;
    index index.html;

    # The SPA fallback. A real file (a stylesheet, a script) is served as
    # itself; anything else falls through to index.html and the client-side
    # router decides what to show. This is what makes a refresh or a pasted
    # link on /patients work -- without it the server would return 404,
    # because there is no patients.html on disk.
    location / {
      try_files $uri $uri/ /index.html;
    }

    # ---- API Gateway ----------------------------------------------------
    # Nginx matches each request on its URL path prefix and forwards it to
    # the service that owns it. The frontend only ever knows this one
    # address and never learns a service's internal port. Because nothing
    # is cross-origin, there is also no CORS to configure.
    #
    # The trailing slash in proxy_pass matters: with it, Nginx replaces the
    # matched location prefix. Without it, the full original path is passed
    # through unchanged.
    #
    # Note the slash in the location names too. "/patients/" matches the API
    # calls the app makes, while the client-side route "/patients" has no
    # trailing slash, so it misses these blocks and falls through to the
    # SPA fallback above. That one character is what keeps the two apart.

    # ---- Client-side routes that collide with an API prefix -------------
    # When a proxied location ends in a slash, Nginx automatically answers
    # the same URI without the slash with a 301 to the version with it.
    # So a request for the app route /patients would be redirected to
    # /patients/ and handed the JSON API instead of the page. An exact-match
    # location ( = ) takes priority over a prefix match, which settles it:
    # /patients serves the app, /patients/ reaches the service.
    location = /patients     { try_files /index.html =404; }
    location = /doctors      { try_files /index.html =404; }
    location = /appointments { try_files /index.html =404; }
    location = /billing      { try_files /index.html =404; }

    location /auth/ {
      proxy_pass http://auth-service:3001/;
      include /etc/nginx/proxy_headers.conf;
    }

    location /patients/ {
      proxy_pass http://patient-service:3002/patients/;
      include /etc/nginx/proxy_headers.conf;
    }

    location /doctors/ {
      proxy_pass http://doctor-service:3003/doctors/;
      include /etc/nginx/proxy_headers.conf;
    }

    location /appointments/ {
      proxy_pass http://appointment-service:3004/appointments/;
      include /etc/nginx/proxy_headers.conf;
    }

    location /billing/ {
      proxy_pass http://billing-service:3005/billing/;
      include /etc/nginx/proxy_headers.conf;
    }
  }
}
